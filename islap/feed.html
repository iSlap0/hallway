<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iSlap — Feed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="min-h-screen bg-islap-black text-white font-body">

  <!-- ================= NAVBAR ================= -->
  <header class="sticky top-0 z-20 bg-islap-black/95 backdrop-blur border-b-4 border-islap-yellow">
    <nav class="max-w-2xl mx-auto flex items-center justify-between px-4 py-3">
      <a href="feed.html" class="text-2xl font-display font-800 text-islap-yellow -rotate-3 inline-block">iSlap</a>
      <div class="flex items-center gap-4 text-sm font-bold">
        <a href="feed.html" class="text-islap-yellow border-b-2 border-islap-yellow pb-0.5">Feed</a>
        <a id="nav-profile-link" href="#" class="text-gray-300 hover:text-islap-yellow transition-colors">My Profile</a>
        <button id="nav-signout-btn" class="bg-islap-purple text-white px-3 py-1.5 rounded-lg border-2 border-white/20 hover:bg-purple-700 transition-colors">
          Sign Out
        </button>
      </div>
    </nav>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-6">

    <!-- ================= COMPOSER ================= -->
    <section class="bg-white text-islap-black rounded-3xl border-4 border-islap-black shadow-islap-hard-yellow p-5 mb-8">
      <h2 class="font-display font-700 text-lg mb-3">What's the tea? ☕</h2>
      <form id="composer-form" class="space-y-3">
        <textarea
          id="composer-content" required maxlength="500" rows="3"
          placeholder="Slap your thoughts onto the feed..."
          class="w-full rounded-xl border-2 border-islap-black px-4 py-3 font-medium focus:outline-none focus:ring-2 focus:ring-islap-purple resize-none"
        ></textarea>

        <div class="flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
          <select
            id="composer-mood"
            class="rounded-xl border-2 border-islap-black px-3 py-2 font-medium bg-white focus:outline-none focus:ring-2 focus:ring-islap-purple"
          >
            <option value="">No mood</option>
            <option value="Feeling cheeky 🤪">Feeling cheeky 🤪</option>
            <option value="Feeling dramatic 🎭">Feeling dramatic 🎭</option>
            <option value="Feeling iconic 💅">Feeling iconic 💅</option>
            <option value="Feeling done with school 😩">Feeling done with school 😩</option>
          </select>

          <button
            type="submit" id="composer-submit"
            class="bg-islap-purple text-white font-display font-700 rounded-xl px-6 py-2.5 border-4 border-islap-black shadow-islap-hard hover:shadow-none hover:translate-x-1 hover:translate-y-1 transition-all disabled:opacity-50"
          >
            Slap it 🙌
          </button>
        </div>
        <p id="composer-error" class="text-sm text-red-600 font-medium hidden"></p>
      </form>
    </section>

    <!-- ================= FEED ================= -->
    <section>
      <div class="flex items-center gap-2 mb-4">
        <h2 class="font-display font-700 text-xl text-islap-yellow">The Feed</h2>
        <span class="flex items-center gap-1 text-xs text-green-400 font-bold">
          <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> live
        </span>
      </div>

      <div id="feed-loading" class="flex justify-center py-10">
        <div class="islap-spinner"></div>
      </div>

      <div id="feed-list" class="space-y-4"></div>

      <p id="feed-empty" class="hidden text-center text-gray-400 py-10">
        No slaps yet. Be the first to post! 🎉
      </p>
    </section>
  </main>

  <!-- Reusable post card template -->
  <template id="post-card-template">
    <article class="post-card islap-card bg-white text-islap-black rounded-2xl border-4 border-islap-black shadow-islap-hard p-4">
      <div class="flex items-start justify-between gap-2 mb-2">
        <a href="#" class="post-username font-display font-700 text-islap-purple hover:underline"></a>
        <span class="post-mood mood-sticker text-xs font-bold bg-islap-yellow text-islap-black px-2 py-1 rounded-full border-2 border-islap-black"></span>
      </div>
      <p class="post-content whitespace-pre-wrap break-words leading-snug mb-2"></p>
      <time class="post-time text-xs text-gray-500 font-medium"></time>
    </article>
  </template>

  <script type="module" src="assets/js/feed.js"></script>
</body>
</html>
