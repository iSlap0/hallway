<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iSlap — Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="min-h-screen bg-islap-black text-white font-body">

  <!-- ================= NAVBAR ================= -->
  <header class="sticky top-0 z-20 bg-islap-black/95 backdrop-blur border-b-4 border-islap-yellow">
    <nav class="max-w-2xl mx-auto flex items-center justify-between px-4 py-3">
      <a href="feed.html" class="text-2xl font-display font-800 text-islap-yellow -rotate-3 inline-block">iSlap</a>
      <div class="flex items-center gap-4 text-sm font-bold">
        <a href="feed.html" class="text-gray-300 hover:text-islap-yellow transition-colors">Feed</a>
        <a id="nav-profile-link" href="#" class="text-islap-yellow border-b-2 border-islap-yellow pb-0.5">My Profile</a>
        <button id="nav-signout-btn" class="bg-islap-purple text-white px-3 py-1.5 rounded-lg border-2 border-white/20 hover:bg-purple-700 transition-colors">
          Sign Out
        </button>
      </div>
    </nav>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-6">

    <div id="profile-loading" class="flex justify-center py-16">
      <div class="islap-spinner"></div>
    </div>

    <div id="profile-not-found" class="hidden text-center py-16 text-gray-400">
      That user doesn't exist. 🕵️
    </div>

    <div id="profile-content" class="hidden">

      <!-- ================= PROFILE CARD (view mode) ================= -->
      <section id="profile-view" class="bg-white text-islap-black rounded-3xl border-4 border-islap-black shadow-islap-hard-yellow p-6 mb-8">
        <div class="flex items-start justify-between gap-3">
          <div>
            <h1 id="profile-username" class="font-display font-800 text-3xl text-islap-purple"></h1>
            <span id="profile-mood" class="mood-sticker inline-block mt-2 text-sm font-bold bg-islap-yellow text-islap-black px-3 py-1 rounded-full border-2 border-islap-black"></span>
          </div>
          <button
            id="edit-profile-btn"
            class="hidden shrink-0 bg-islap-purple text-white text-sm font-bold px-4 py-2 rounded-xl border-2 border-islap-black hover:bg-purple-700 transition-colors"
          >
            Edit ✏️
          </button>
        </div>
        <p id="profile-bio" class="mt-4 text-gray-700 leading-relaxed whitespace-pre-wrap"></p>
        <p id="profile-joined" class="mt-3 text-xs text-gray-400 font-medium"></p>
      </section>

      <!-- ================= PROFILE EDIT FORM (own profile only) ================= -->
      <section id="profile-edit" class="hidden bg-white text-islap-black rounded-3xl border-4 border-islap-black shadow-islap-hard-yellow p-6 mb-8">
        <h2 class="font-display font-700 text-lg mb-4">Edit your profile</h2>
        <form id="edit-form" class="space-y-4">
          <div>
            <label class="block text-sm font-bold mb-1" for="edit-username">Username</label>
            <input
              id="edit-username" name="username" type="text" required
              minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}"
              class="w-full rounded-xl border-2 border-islap-black px-4 py-2.5 font-medium focus:outline-none focus:ring-2 focus:ring-islap-purple"
            />
          </div>
          <div>
            <label class="block text-sm font-bold mb-1" for="edit-mood">Mood badge</label>
            <select
              id="edit-mood" name="mood_badge"
              class="w-full rounded-xl border-2 border-islap-black px-4 py-2.5 font-medium bg-white focus:outline-none focus:ring-2 focus:ring-islap-purple"
            >
              <option value="Feeling cheeky 🤪">Feeling cheeky 🤪</option>
              <option value="Feeling dramatic 🎭">Feeling dramatic 🎭</option>
              <option value="Feeling iconic 💅">Feeling iconic 💅</option>
              <option value="Feeling done with school 😩">Feeling done with school 😩</option>
              <option value="Feeling new here 👋">Feeling new here 👋</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-bold mb-1" for="edit-bio">Bio</label>
            <textarea
              id="edit-bio" name="bio" rows="3" maxlength="200"
              class="w-full rounded-xl border-2 border-islap-black px-4 py-2.5 font-medium focus:outline-none focus:ring-2 focus:ring-islap-purple resize-none"
            ></textarea>
          </div>
          <p id="edit-error" class="text-sm text-red-600 font-medium hidden"></p>
          <div class="flex gap-3">
            <button type="submit" id="edit-save-btn"
              class="bg-islap-purple text-white font-display font-700 rounded-xl px-6 py-2.5 border-4 border-islap-black shadow-islap-hard hover:shadow-none hover:translate-x-1 hover:translate-y-1 transition-all disabled:opacity-50">
              Save changes
            </button>
            <button type="button" id="edit-cancel-btn"
              class="bg-gray-200 text-islap-black font-bold rounded-xl px-6 py-2.5 border-2 border-islap-black hover:bg-gray-300 transition-colors">
              Cancel
            </button>
          </div>
        </form>
      </section>

      <!-- ================= USER'S POSTS ================= -->
      <section>
        <h2 class="font-display font-700 text-xl text-islap-yellow mb-4">Slaps</h2>
        <div id="profile-posts" class="space-y-4"></div>
        <p id="profile-posts-empty" class="hidden text-center text-gray-400 py-8">
          No slaps yet.
        </p>
      </section>
    </div>
  </main>

  <template id="profile-post-template">
    <article class="islap-card bg-white text-islap-black rounded-2xl border-4 border-islap-black shadow-islap-hard p-4">
      <div class="flex items-start justify-between gap-2 mb-2">
        <span class="text-xs text-gray-400"></span>
        <span class="post-mood mood-sticker text-xs font-bold bg-islap-yellow text-islap-black px-2 py-1 rounded-full border-2 border-islap-black"></span>
      </div>
      <p class="post-content whitespace-pre-wrap break-words leading-snug"></p>
    </article>
  </template>

  <script type="module" src="assets/js/profile.js"></script>
</body>
</html>
