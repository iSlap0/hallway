<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iSlap — Set Up Your Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="min-h-screen bg-islap-black text-white font-body flex items-center justify-center px-4 py-10">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <span class="text-4xl font-display font-800 text-islap-yellow -rotate-3 inline-block">iSlap</span>
      <h1 class="mt-4 text-2xl font-display font-700">Pick your alter ego 🎭</h1>
      <p class="text-gray-400 text-sm mt-2">
        This is what everyone sees on the feed. Your Gmail name/email is
        never shown — pinky promise.
      </p>
    </div>

    <form id="onboarding-form" class="bg-white text-islap-black rounded-3xl border-4 border-islap-black shadow-islap-hard-yellow p-6 space-y-5">

      <div>
        <label class="block text-sm font-bold mb-1" for="username">Anonymous username</label>
        <input
          id="username" name="username" type="text" required
          minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}"
          placeholder="e.g. CheekyPanther42"
          class="w-full rounded-xl border-2 border-islap-black px-4 py-2.5 font-medium focus:outline-none focus:ring-2 focus:ring-islap-purple"
        />
        <p class="text-xs text-gray-500 mt-1">3-24 characters, letters/numbers/underscore only.</p>
      </div>

      <div>
        <label class="block text-sm font-bold mb-1" for="password">Set a password</label>
        <input
          id="password" name="password" type="password" required minlength="6"
          placeholder="For account security & settings"
          class="w-full rounded-xl border-2 border-islap-black px-4 py-2.5 font-medium focus:outline-none focus:ring-2 focus:ring-islap-purple"
        />
        <p class="text-xs text-gray-500 mt-1">At least 6 characters. Stored securely via Supabase Auth.</p>
      </div>

      <div>
        <label class="block text-sm font-bold mb-1" for="mood_badge">Mood badge</label>
        <select
          id="mood_badge" name="mood_badge"
          class="w-full rounded-xl border-2 border-islap-black px-4 py-2.5 font-medium bg-white focus:outline-none focus:ring-2 focus:ring-islap-purple"
        >
          <option value="Feeling cheeky 🤪">Feeling cheeky 🤪</option>
          <option value="Feeling dramatic 🎭">Feeling dramatic 🎭</option>
          <option value="Feeling iconic 💅">Feeling iconic 💅</option>
          <option value="Feeling done with school 😩">Feeling done with school 😩</option>
          <option value="Feeling new here 👋" selected>Feeling new here 👋</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-bold mb-1" for="bio">Bio <span class="font-normal text-gray-400">(optional)</span></label>
        <textarea
          id="bio" name="bio" rows="3" maxlength="200"
          placeholder="A little something about the anonymous you..."
          class="w-full rounded-xl border-2 border-islap-black px-4 py-2.5 font-medium focus:outline-none focus:ring-2 focus:ring-islap-purple resize-none"
        ></textarea>
      </div>

      <p id="form-error" class="text-sm text-red-600 font-medium hidden"></p>

      <button
        type="submit" id="submit-btn"
        class="w-full bg-islap-purple text-white font-display font-700 text-lg rounded-xl py-3 border-4 border-islap-black shadow-islap-hard hover:shadow-none hover:translate-x-1 hover:translate-y-1 transition-all disabled:opacity-50"
      >
        Slap into iSlap 🙌
      </button>
    </form>
  </div>

  <script type="module" src="assets/js/onboarding.js"></script>
</body>
</html>
